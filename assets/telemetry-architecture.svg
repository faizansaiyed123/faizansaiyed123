<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry architecture</title>
  <desc id="desc">FastAPI REST and WebSocket layers surround a telemetry manager that generates signals, detects anomalies and persists asynchronously to PostgreSQL.</desc>
  <rect width="1200" height="420" rx="18" fill="#0c1218"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="55" y="52" fill="#f4f7fa" font-size="25" font-weight="700">Telemetry · realtime observability loop</text>
    <text x="55" y="80" fill="#8da2b5" font-size="16">generate → detect → broadcast → persist</text>

    <rect x="55" y="125" width="200" height="108" rx="14" fill="#111a22" stroke="#49d3e6"/>
    <text x="80" y="160" fill="#49d3e6" font-size="15" font-weight="700">FASTAPI</text>
    <text x="80" y="187" fill="#f4f7fa" font-size="18" font-weight="700">REST API</text>
    <text x="80" y="213" fill="#8da2b5" font-size="14">auth · history · controls</text>

    <rect x="55" y="265" width="200" height="108" rx="14" fill="#111a22" stroke="#49d3e6"/>
    <text x="80" y="300" fill="#49d3e6" font-size="15" font-weight="700">WEBSOCKET</text>
    <text x="80" y="327" fill="#f4f7fa" font-size="18" font-weight="700">Live stream</text>
    <text x="80" y="353" fill="#8da2b5" font-size="14">telemetry · alerts · system</text>

    <rect x="345" y="125" width="270" height="248" rx="16" fill="#101922" stroke="#2a3a46"/>
    <text x="375" y="163" fill="#49d3e6" font-size="15" font-weight="700">TELEMETRY MANAGER</text>
    <text x="375" y="195" fill="#f4f7fa" font-size="18" font-weight="700">bounded runtime state</text>
    <line x1="375" y1="212" x2="585" y2="212" stroke="#23303a"/>
    <text x="375" y="241" fill="#8da2b5" font-size="14">1 · correlated signal generation</text>
    <text x="375" y="269" fill="#8da2b5" font-size="14">2 · rolling anomaly detection</text>
    <text x="375" y="297" fill="#8da2b5" font-size="14">3 · alert lifecycle + dedupe</text>
    <text x="375" y="325" fill="#8da2b5" font-size="14">4 · bounded persistence queue</text>
    <text x="375" y="353" fill="#8da2b5" font-size="14">5 · WebSocket fan-out</text>

    <rect x="705" y="105" width="205" height="100" rx="14" fill="#111a22" stroke="#2a3a46"/>
    <text x="730" y="142" fill="#49d3e6" font-size="15" font-weight="700">ANOMALY / ALERT</text>
    <text x="730" y="170" fill="#8da2b5" font-size="14">z-score · severity · ack</text>

    <rect x="705" y="230" width="205" height="100" rx="14" fill="#111a22" stroke="#2a3a46"/>
    <text x="730" y="267" fill="#49d3e6" font-size="15" font-weight="700">POSTGRESQL</text>
    <text x="730" y="294" fill="#8da2b5" font-size="14">telemetry + alert history</text>

    <rect x="965" y="140" width="180" height="155" rx="14" fill="#101922" stroke="#49d3e6"/>
    <text x="990" y="176" fill="#49d3e6" font-size="15" font-weight="700">DASHBOARD</text>
    <text x="990" y="206" fill="#f4f7fa" font-size="18" font-weight="700">React UI</text>
    <text x="990" y="232" fill="#8da2b5" font-size="14">metrics · charts</text>
    <text x="990" y="254" fill="#8da2b5" font-size="14">alerts · analytics</text>
    <text x="990" y="276" fill="#8da2b5" font-size="14">admin · hosts</text>

    <path d="M255 179 H345" stroke="#49d3e6" stroke-width="2.5"/>
    <path d="M255 319 H345" stroke="#49d3e6" stroke-width="2.5"/>
    <path d="M615 215 H705" stroke="#49d3e6" stroke-width="2.5"/>
    <path d="M615 320 H705" stroke="#718393" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M910 180 H965" stroke="#49d3e6" stroke-width="2.5"/>
    <path d="M910 280 H965" stroke="#49d3e6" stroke-width="2"/>
    <path d="M615 150 C700 85 865 85 965 160" fill="none" stroke="#718393" stroke-width="2" stroke-dasharray="7 7"/>

    <rect x="55" y="387" width="1090" height="20" rx="8" fill="#0f171f"/>
  </g>
</svg>