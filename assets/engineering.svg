<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Engineering practices</title>
  <desc id="desc">Six connected engineering concerns: API, realtime, async work, persistence, security, testing.</desc>
  <rect width="1200" height="250" rx="18" fill="#0c1218"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="45" fill="#f4f7fa" font-size="23" font-weight="700">Engineering evidence</text>
    <text x="48" y="69" fill="#8da2b5" font-size="15">design concerns carried from interface to backend and verification</text>
    <line x1="90" y1="150" x2="1110" y2="150" stroke="#2a3a46" stroke-width="2"/>
    <g>
      <circle cx="120" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <circle cx="300" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <circle cx="480" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <circle cx="660" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <circle cx="840" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <circle cx="1020" cy="150" r="24" fill="#111a22" stroke="#49d3e6" stroke-width="2"/>
      <text x="120" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">API</text>
      <text x="300" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">LIVE</text>
      <text x="480" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">ASYNC</text>
      <text x="660" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">DATA</text>
      <text x="840" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">SECURE</text>
      <text x="1020" y="157" fill="#49d3e6" font-size="14" text-anchor="middle" font-weight="700">TEST</text>
      <text x="120" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">contracts</text>
      <text x="300" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">WebSocket</text>
      <text x="480" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">workers</text>
      <text x="660" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">persistence</text>
      <text x="840" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">auth + validation</text>
      <text x="1020" y="202" fill="#8da2b5" font-size="13" text-anchor="middle">unit → browser</text>
    </g>
  </g>
</svg>