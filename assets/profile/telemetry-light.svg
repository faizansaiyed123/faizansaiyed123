<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Telemetry architecture — realtime observability</title>
<desc id="desc">Telemetry flow from synthetic signal generation through anomaly detection, alerting, asynchronous persistence and authenticated WebSockets to the dashboard.</desc>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F7F9"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
