<text x="50" y="48" fill="#18212B" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">Telemetry · realtime observability</text>
<text x="50" y="73" fill="#647384" font-family="Inter,Arial,sans-serif" font-size="14">generate → detect → persist → stream</text>
