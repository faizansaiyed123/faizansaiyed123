<text x="318" y="176" fill="#18212B" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Telemetry manager</text></g>
<g><rect x="570" y="95" width="210" height="92" rx="14" fill="#FFFFFF" stroke="#647384" stroke-width="1.5"/>
<text x="588" y="121" fill="#0B7285" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ANALYSIS</text>
