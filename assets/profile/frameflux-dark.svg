<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">FrameFlux architecture — asynchronous media processing</title>
<desc id="desc">FrameFlux flow from upload and validation through Redis and ARQ background processing with FFmpeg and stored output.</desc>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1117"/><stop offset="1" stop-color="#111922"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8B9AA8" stroke-opacity=".16"/></pattern>
</defs>
<rect width="100%" height="100%" rx="22" fill="url(#fade)"/>
<text x="50" y="48" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">FrameFlux · asynchronous media processing</text>
<text x="50" y="73" fill="#8B9AA8" font-family="Inter,Arial,sans-serif" font-size="14">heavy media work moves out of the request path</text>
<g><rect x="50" y="125" width="155" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="68" y="151" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CLIENT</text>
<text x="68" y="176" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Browser UI</text></g>
<g><rect x="250" y="125" width="155" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="268" y="151" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INPUT</text>
<text x="268" y="176" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Upload</text></g>
<g><rect x="450" y="125" width="155" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="468" y="151" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">BOUNDARY</text>
<text x="468" y="176" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Validate</text></g>
<g><rect x="650" y="90" width="200" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="668" y="116" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">QUEUE</text>
<text x="668" y="141" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Redis / ARQ</text></g>
<g><rect x="650" y="205" width="200" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="668" y="231" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">WORKER</text>
<text x="668" y="256" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Background job</text></g>
<g><rect x="920" y="145" width="215" height="92" rx="14" fill="#111922" stroke="#8B9AA8" stroke-width="1.5"/>
<text x="938" y="171" fill="#49D3E6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MEDIA ENGINE</text>
<text x="938" y="196" fill="#F0F6FC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">FFmpeg</text></g>
<path d="M205 171H250 M405 171H450 M605 160H650 M750 182V205 M850 251H920" stroke="#49D3E6" stroke-width="2.5"/>
<circle cx="227" cy="171" r="4" fill="#49D3E6"/><circle cx="427" cy="171" r="4" fill="#49D3E6"/><circle cx="627" cy="160" r="4" fill="#49D3E6"/><circle cx="880" cy="251" r="4" fill="#49D3E6"/>
<text x="920" y="270" fill="#8B9AA8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">PROCESS → OUTPUT / STORAGE</text>
<text x="50" y="365" fill="#8B9AA8" font-family="Inter,Arial,sans-serif" font-size="13">Resumable uploads · validation · job state · progress · media transformation</text>
</svg>