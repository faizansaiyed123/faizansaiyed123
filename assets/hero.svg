<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Faizan Saiyed — backend-focused engineer</title>
  <desc id="desc">A restrained engineering-themed header with a system grid and a single cyan accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="0.55" stop-color="#0e151c"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2430" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="430" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="428" rx="21" fill="url(#grid)" opacity=".48"/>
  <path d="M80 330 H1320" stroke="#27323e"/>
  <path d="M80 330 C260 330 260 275 410 275 S650 330 800 330 S1040 275 1320 275" fill="none" stroke="#49d3e6" stroke-width="2.5" opacity=".9"/>
  <circle cx="410" cy="275" r="4.5" fill="#49d3e6"/>
  <circle cx="800" cy="330" r="4.5" fill="#49d3e6"/>
  <circle cx="1040" cy="275" r="4.5" fill="#49d3e6"/>
  <text x="82" y="92" fill="#8da2b5" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="2.8">ENGINEERING SYSTEMS</text>
  <text x="82" y="165" fill="#f4f7fa" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="58">Faizan Saiyed</text>
  <text x="82" y="215" fill="#c6d2dc" font-family="Inter,Arial,sans-serif" font-size="25">Backend-focused engineer building systems, APIs and realtime applications.</text>
  <text x="82" y="255" fill="#8da2b5" font-family="Inter,Arial,sans-serif" font-size="18">FastAPI · PostgreSQL · WebSockets · Async Workers · React / Next.js · Testing</text>
  <g transform="translate(1080 70)">
    <rect width="230" height="118" rx="14" fill="#111a22" stroke="#263540"/>
    <circle cx="24" cy="27" r="5" fill="#49d3e6"/>
    <text x="42" y="33" fill="#dce7ef" font-family="Inter,Arial,sans-serif" font-size="16">SYSTEMS</text>
    <text x="24" y="61" fill="#8da2b5" font-family="Inter,Arial,sans-serif" font-size="15">APIs</text>
    <text x="24" y="84" fill="#8da2b5" font-family="Inter,Arial,sans-serif" font-size="15">Realtime</text>
    <text x="24" y="107" fill="#8da2b5" font-family="Inter,Arial,sans-serif" font-size="15">Async processing</text>
  </g>
</svg>